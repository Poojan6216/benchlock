[project]
name = "benchlock"
version = "0.1.0"
description = "Anytime-valid attribution for LLM eval pipelines: did your system regress, or did the judge change underneath you?"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Benchlock contributors" }]
keywords = [
    "llm", "evaluation", "llm-as-judge", "drift", "sequential-testing",
    "anytime-valid", "e-values", "confidence-sequences", "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[project.urls]
Homepage = "https://github.com/benchlock/benchlock"
Repository = "https://github.com/benchlock/benchlock"

[project.scripts]
benchlock = "benchlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchlock"]

[dependency-groups]
# `confseq` (Howard/Waudby-Smith/Ramdas) is our test ORACLE for Phase 1.3, kept in its
# own group because it builds from source and needs Boost headers. CI installs Boost and
# runs with this group so the differential test always executes there.
#   macOS:  brew install boost && uv sync --group oracle
#   Debian: sudo apt-get install -y libboost-dev cmake && uv sync --group oracle
oracle = ["confseq>=0.0.11"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "matplotlib>=3.8",
    "river>=0.21",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ANN",              # annotations
    "PTH",              # use pathlib
    "RET",              # return
    "ARG",              # unused arguments
]
ignore = [
    "ANN401",   # allow Any in narrowly-scoped internal helpers (never in public sigs; mypy strict guards)
    "N803",     # math code uses capital arg names (X, K)
    "N806",     # math code uses capital locals (X, K, M)
]

[tool.ruff.lint.per-file-ignores]
# In a Typer app the command signature *is* the CLI surface: parameters are declared to
# create flags, and a command that does not read one of its own flags is not a smell.
"src/benchlock/cli.py" = ["ARG001"]
# Doc generators are f-string templates of markdown tables; wrapping them would make the
# generated output harder to read than the source.
"scripts/*" = ["E501"]
"tests/*" = ["ANN", "ARG", "B", "E501"]
"bench/*" = ["ANN", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy.*", "river.*", "confseq.*", "matplotlib.*", "ulid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: long-running simulation tests",
    "mandatory: tests that may never be skipped or xfailed (Hard Rules)",
    "network: requires a live judge provider API key",
]
filterwarnings = ["error::DeprecationWarning:benchlock.*"]

[tool.coverage.run]
source = ["src/benchlock"]
branch = true
