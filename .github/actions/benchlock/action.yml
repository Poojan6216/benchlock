name: Benchlock
description: >-
  Attribute eval score movement to your system or your judge, and gate CI on the answer.
  A judge change posts a comment and passes; a real regression fails the check.

inputs:
  results:
    description: Path to your eval output (the file your eval framework writes).
    required: true
  config:
    description: Path to benchlock.yaml.
    required: false
    default: benchlock.yaml
  ledger:
    description: Path to the append-only ledger.
    required: false
    default: .benchlock/ledger.jsonl
  target-shift:
    description: The smallest judge shift your anchor set was provisioned to catch.
    required: false
    default: "0.05"
  comment:
    description: Post the verdict as a PR comment.
    required: false
    default: "true"
  rescore-anchors:
    description: Re-score the frozen anchor set as part of this run.
    required: false
    default: "true"
  ref:
    description: The benchlock git ref to install. Pin this to a tag for reproducible runs.
    required: false
    default: main
  anthropic-api-key:
    description: >-
      API key for the judge. REQUIRED whenever rescore-anchors is true, because
      re-scoring the frozen anchor set calls your judge. Pass a secret, never a literal.
    required: false
    default: ""
  openai-api-key:
    description: API key for the judge when `judge.provider` is `openai`.
    required: false
    default: ""

outputs:
  verdict:
    description: stable | judge | system | both | indeterminate
    value: ${{ steps.gate.outputs.verdict }}
  rule:
    description: The lattice rule that produced the verdict.
    value: ${{ steps.gate.outputs.rule }}

runs:
  using: composite
  steps:
    # Not on PyPI, so `pipx install benchlock` cannot work and would fail every run of
    # this action. Installed from the repository instead, pinned to a ref the caller can
    # change; this becomes a released version the day the package is published.
    - name: Install benchlock
      shell: bash
      run: pipx install "benchlock[anthropic] @ git+https://github.com/Poojan6216/benchlock@${{ inputs.ref }}"

    # Re-scoring the anchors calls the judge, so it needs a key. Failing here with a
    # sentence naming the missing input beats failing three steps later inside the
    # adapter with "no Anthropic API key found" and no hint that this action has an
    # input for it.
    - name: Check the judge is reachable
      if: ${{ inputs.rescore-anchors == 'true' }}
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
          echo "::error::rescore-anchors is true, which re-scores the frozen anchor set with your judge, but no API key was supplied. Pass anthropic-api-key (or openai-api-key) from a repository secret, or set rescore-anchors: false and record anchor runs yourself." >&2
          exit 1
        fi

    - name: Record this run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        benchlock observe "${{ inputs.results }}" \
          --config "${{ inputs.config }}" \
          --ledger "${{ inputs.ledger }}" \
          ${{ inputs.rescore-anchors == 'true' && '--rescore-anchors' || '' }}

    - name: Attribute the movement
      id: gate
      shell: bash
      run: |
        set +e
        benchlock verdict --json --no-record \
          --config "${{ inputs.config }}" \
          --ledger "${{ inputs.ledger }}" \
          --target-shift "${{ inputs.target-shift }}" > verdict.json
        python -c "
        import json, os
        v = json.load(open('verdict.json'))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f\"verdict={v['verdict']}\n\")
            f.write(f\"rule={v['rule_id']}\n\")
        "
        benchlock report \
          --config "${{ inputs.config }}" \
          --ledger "${{ inputs.ledger }}" \
          --target-shift "${{ inputs.target-shift }}" \
          --out benchlock-report.md
        cat benchlock-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr comment "${{ github.event.number }}" --body-file benchlock-report.md

    # Last, so the comment is posted even when the gate fails. A `judge` verdict exits 0:
    # a judge change must not fail your build, it must tell you to re-baseline.
    - name: Gate
      shell: bash
      run: |
        benchlock gate \
          --config "${{ inputs.config }}" \
          --ledger "${{ inputs.ledger }}" \
          --target-shift "${{ inputs.target-shift }}"
